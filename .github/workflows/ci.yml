name: CI

# The three gates below are exactly the ones that pass with no services attached:
# tsc --noEmit, vitest, and the Vite production build. `npm run test:api`,
# `test:flow` and `test:consistency` are deliberately absent — the first needs a
# live API *and* a reachable Postgres, and the other two drive a running server.
# A pipeline that provisions a database to run them would be testing the CI
# harness, not the change.
#
# The job stays on ubuntu-latest and uses only POSIX shell. The development
# machine is Windows, so anything platform-shaped added here would be a step that
# cannot be reproduced locally.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Superseded runs are cancelled: a fix pushed while the previous run is still
# installing dependencies should not queue behind it, and the older result is
# describing code nobody has any more.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Node 24 is the runtime the app actually deploys on: `node server/index.ts`
          # executes TypeScript directly, with no transpiler in the image. Building
          # the SPA on 24 keeps CI honest about that.
          node-version: 24
          cache: npm

      # `npm ci` rather than `npm install`: CI must fail when package-lock.json and
      # package.json disagree instead of silently rewriting the lockfile.
      - name: Install dependencies
        run: npm ci

      # Gates run in this order, each one failing the job: typecheck is seconds,
      # tests are the slowest feedback, and build is last because it is the only
      # step that can pass while the other two are broken.
      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build (vite build)
        run: npm run build
