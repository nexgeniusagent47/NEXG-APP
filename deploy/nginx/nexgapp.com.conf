# Production reverse proxy for NEXG App.
# Install at /etc/nginx/sites-available/nexgapp.com and keep the enabled symlink.
# The Cloudflare Origin CA certificate is intentionally not publicly trusted;
# Cloudflare must use Full (strict), and origin traffic should arrive through Cloudflare.

server {
    listen 80;
    listen [::]:80;
    server_name nexgapp.com www.nexgapp.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nexgapp.com www.nexgapp.com;

    ssl_certificate     /etc/ssl/certs/nexgapp-origin-20260925.pem;
    ssl_certificate_key /etc/ssl/private/nexgapp-origin-20260925.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Merchant onboarding attaches documents.
    client_max_body_size 12M;

    # Temporary safety gate until Cloudflare Access and origin JWT verification
    # are implemented. The operations dashboard remains unavailable meanwhile.
    # Express route matching is case-insensitive and accepts a trailing slash;
    # catch those variants here as well as the canonical path.
    location ~* ^/api/(metrics|traces)(/|$) {
        return 404;
    }

    # Browser telemetry ingestion stays open; its in-memory read endpoint does not.
    location ~* ^/api/telemetry(/|$) {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Long-lived, content-hashed assets.
    location /assets/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app trusts exactly one proxy hop for client rate limiting.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
