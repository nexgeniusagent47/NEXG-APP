<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXG App</title>
    <meta name="description" content="On-demand luxury concierge & gourmet discovery with NEXG bespoke experience and PostgreSQL database." />
    <meta property="og:title" content="NEXG App" />
    <meta property="og:description" content="On-demand luxury concierge & gourmet discovery with NEXG bespoke experience and PostgreSQL database." />

    <!-- The mark is the G with the bell, lifted from the NEXG logo. SVG alone, with no
         .ico fallback: every browser this product targets supports SVG favicons, and a
         multi-size .ico of the same mark would be three binary files to keep in step with
         one source. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Dark tab strips: the bell's body is black in the source artwork and vanishes, so the
         dark variant recolours it to the gold accent. Two files rather than one with an
         internal media query, because a favicon is fetched without page context and some
         browsers do not evaluate media queries inside it. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#111315" />

    <!-- Fonts are fetched from Google's CDN; opening the connection early keeps the
         first paint from waiting on a cold TLS handshake. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
