<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is REQUIRED for safe-area insets to work at all.
         Without it `env(safe-area-inset-bottom)` resolves to 0 on every device, so the app
         cannot avoid the home indicator or the notch no matter what CSS asks for. This is the
         switch that makes the insets available; the CSS consumes them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NEXG App</title>
    <meta name="description" content="On-demand luxury concierge & gourmet discovery with NEXG bespoke experience and PostgreSQL database." />
    <meta property="og:title" content="NEXG App" />
    <meta property="og:description" content="On-demand luxury concierge & gourmet discovery with NEXG bespoke experience and PostgreSQL database." />

    <!-- The mark is the G with the bell, lifted from the NEXG logo. SVG alone, with no
         .ico fallback: every browser this product targets supports SVG favicons, and a
         multi-size .ico of the same mark would be three binary files to keep in step with
         one source. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Dark tab strips: the bell's body is black in the source artwork and vanishes, so the
         dark variant recolours it to the gold accent. Two files rather than one with an
         internal media query, because a favicon is fetched without page context and some
         browsers do not evaluate media queries inside it. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#111315" />

    <!-- Fonts are fetched from Google's CDN; opening the connection early keeps the
         first paint from waiting on a cold TLS handshake. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
<!-- impeccable-live-start -->
<!--
  Impeccable live mode, LOADED ONLY IN THE TAB THAT ASKS FOR IT.

  This was an unconditional <script src="http://localhost:8400/live.js?...">. The device room
  loads 30 iframes of this page, so thirty copies of the editing overlay loaded inside it, and
  whichever lost the race rendered the toolbar shell instead of the app — frames came back empty
  and pale while the app itself was fine.

  Guarded on `?live=1` so the two can coexist: add the parameter to the tab you want to edit in,
  and every other consumer of this page — the device room's frames, the audit's own browser,
  screenshots — gets the real application with nothing injected.

  The token stays in the block because the Impeccable tooling reads and rewrites it. The build
  strips this whole range, so none of it reaches production.
-->
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    // `live=1` on this tab only. A frame inside the room never carries it.
    if (params.get('live') !== '1') return;
    var s = document.createElement('script');
    s.src = 'http://localhost:8400/live.js?token=05f81c07-60f1-4e28-92f4-261ea63fadd5';
    document.body.appendChild(s);
  })();
</script>
<!-- impeccable-live-end -->
</body>
</html>
